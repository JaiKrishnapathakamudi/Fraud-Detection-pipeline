global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "kafka"
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Optional: Spark exposes a Prometheus-compatible metrics endpoint
  # when spark.ui.prometheus.enabled=true is set on spark-submit.
  - job_name: "spark"
    metrics_path: /metrics/prometheus
    static_configs:
      - targets: ["spark-master:8080", "spark-worker:8081"]
