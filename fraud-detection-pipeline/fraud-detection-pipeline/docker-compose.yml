version: "3.8"

# =====================================================================
# Real-Time Financial Fraud Detection Pipeline
# Full local infrastructure: Kafka, Zookeeper, Cassandra, Spark,
# Prometheus, Grafana, and a Kafka Exporter for topic-level metrics.
# =====================================================================

services:

  # ---------------------------------------------------------------
  # Messaging layer
  # ---------------------------------------------------------------
  zookeeper:
    image: bitnami/zookeeper:3.9
    container_name: fraud-zookeeper
    ports:
      - "2181:2181"
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    volumes:
      - zookeeper_data:/bitnami/zookeeper
    networks:
      - fraud-net

  kafka:
    image: bitnami/kafka:3.6
    container_name: fraud-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CFG_NUM_PARTITIONS: 6
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/bitnami/kafka
    networks:
      - fraud-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: fraud-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - fraud-net

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: fraud-kafka-exporter
    depends_on:
      - kafka
    command: ["--kafka.server=kafka:9092"]
    ports:
      - "9308:9308"
    networks:
      - fraud-net

  # ---------------------------------------------------------------
  # Storage layer
  # ---------------------------------------------------------------
  cassandra:
    image: cassandra:4.1
    container_name: fraud-cassandra
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: fraud_cluster
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces'"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - fraud-net

  # ---------------------------------------------------------------
  # Processing layer (Spark standalone: 1 master + 1 worker)
  # ---------------------------------------------------------------
  spark-master:
    image: bitnami/spark:3.5
    container_name: fraud-spark-master
    environment:
      SPARK_MODE: master
    ports:
      - "8081:8080"   # Spark master UI
      - "7077:7077"
    networks:
      - fraud-net

  spark-worker:
    image: bitnami/spark:3.5
    container_name: fraud-spark-worker
    depends_on:
      - spark-master
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2
    networks:
      - fraud-net

  # ---------------------------------------------------------------
  # Monitoring layer
  # ---------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: fraud-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - fraud-net

  grafana:
    image: grafana/grafana:latest
    container_name: fraud-grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    networks:
      - fraud-net

networks:
  fraud-net:
    driver: bridge

volumes:
  zookeeper_data:
  kafka_data:
  cassandra_data:
  prometheus_data:
  grafana_data:
